<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Twins Spelling Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one centered play column. Home = word board + five game buttons. Games = progress bar, prompt, answer area, feedback bar. */
:root{
  --bg:#eef3fb; --surface:#ffffff; --ink:#132043; --muted:#5b6788; --line:#d5dded;
  --accent:#2f5bea; --accent-ink:#ffffff; --gold:#f5a800; --good:#178a4c; --good-bg:#dff5e8; --bad:#c62f3d; --bad-bg:#fde3e5;
  --tile:#e3ebfd; --shadow:0 2px 0 rgba(19,32,67,.12);
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1730; --surface:#18234a; --ink:#eaf0ff; --muted:#a1aed3; --line:#2c3a6b;
  --accent:#7d9bff; --accent-ink:#0f1730; --gold:#ffc23d; --good:#5fd394; --good-bg:#12382a; --bad:#ff8892; --bad-bg:#3d1b24;
  --tile:#25336a; --shadow:0 2px 0 rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1730; --surface:#18234a; --ink:#eaf0ff; --muted:#a1aed3; --line:#2c3a6b;
  --accent:#7d9bff; --accent-ink:#0f1730; --gold:#ffc23d; --good:#5fd394; --good-bg:#12382a; --bad:#ff8892; --bad-bg:#3d1b24;
  --tile:#25336a; --shadow:0 2px 0 rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;padding-inline:16px;padding-block:20px 40px}
main{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance;font-weight:600}
h1{font-size:2rem} h2{font-size:1.4rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tag{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.w small{display:block;color:var(--muted);font-size:.8rem;line-height:1.3;font-weight:600;margin-top:2px}
.w{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;background:var(--tile);border-radius:12px;padding:10px 14px;border:0;text-align:left;min-width:0}
.w b{font-family:var(--display);font-weight:600;font-size:1.1rem;overflow-wrap:anywhere}
.stars{color:var(--gold);letter-spacing:1px;white-space:nowrap;font-size:1rem}
.stars i{font-style:normal;color:var(--line)}
.tests{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.test strong{font-size:1.4rem}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.mode{background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:16px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.mode strong{font-family:var(--display);font-size:1.25rem;font-weight:600}
.mode span{font-size:.92rem;font-weight:700;opacity:.92}
.mode:active{transform:translateY(2px)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 20px;font-weight:800;box-shadow:var(--shadow)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;flex:1;min-width:100px}
.bar>div{height:100%;background:var(--gold);transition:width .3s}
.prompt{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.sentence{font-size:1.05rem;color:var(--muted);margin:0}
.big{font-family:var(--display);font-size:clamp(2rem,9vw,3.2rem);font-weight:600;letter-spacing:.02em;overflow-wrap:anywhere}
.syl{font-family:var(--display);font-size:1.4rem;color:var(--accent);letter-spacing:.06em}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{width:clamp(28px,7.8vw,46px);height:clamp(38px,10vw,56px);border-radius:10px;border:2px dashed var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:clamp(1.2rem,5vw,1.8rem);font-weight:600;padding:0}
.slot.fixed{background:var(--tile);border:2px solid var(--tile)}
.slot.filled{border:2px solid var(--accent);background:var(--tile)}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile{width:clamp(40px,10vw,52px);height:clamp(44px,11vw,56px);border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:1.5rem;font-weight:600;box-shadow:var(--shadow);padding:0}
.tile:disabled{opacity:.25;box-shadow:none}
input.type{width:100%;font-family:var(--display);font-size:1.7rem;font-weight:600;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);letter-spacing:.06em}
.fb{border-radius:14px;padding:12px 16px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.fb.good{background:var(--good-bg);color:var(--good)} .fb.bad{background:var(--bad-bg);color:var(--bad)} .fb.info{background:var(--tile);color:var(--ink)}
.fb .word{font-family:var(--display);letter-spacing:.06em}
.choices{display:flex;gap:12px;flex-wrap:wrap}
.choices .btn{font-family:var(--display);font-size:1.5rem;min-width:130px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.spk{display:inline-flex;align-items:center;gap:8px}
.score{font-family:var(--display);font-size:3rem;font-weight:700;color:var(--accent)}
.miss{color:var(--bad);font-weight:800}
.hit{color:var(--good);font-weight:800}
.boss{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.boss svg{width:84px;height:auto;flex:none}
.hp{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.hpbar{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.hpbar>div{height:100%;background:var(--bad);transition:width .4s}
.hearts{color:var(--bad);font-size:1.4rem;letter-spacing:3px;line-height:1}
.hearts i{font-style:normal;color:var(--line)}
.mon{animation:bob 2.4s ease-in-out infinite}
.hurt .mon{animation:shake .4s}
@keyframes bob{50%{transform:translateY(-4px)}}
.bigmon svg{width:150px;height:auto}
.chip{font-weight:800;font-size:.85rem;color:var(--accent);white-space:nowrap;min-width:0}
.mode.alt{background:var(--surface);color:var(--ink);border:2px solid var(--accent)}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sticker{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px;border-radius:16px;background:var(--surface);border:2px solid var(--line);min-width:0}
.sticker svg{width:72px;height:72px}
.sticker b{font-family:var(--display);font-weight:600}
.sticker small{color:var(--muted);font-size:.8rem;line-height:1.3}
.sticker.locked{opacity:.55}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;font-weight:800;z-index:10;max-width:90vw;text-align:center}
.arena{border:2px solid var(--line);border-radius:16px;overflow:hidden;background:var(--tile)}
.arena canvas{display:block;width:100%;height:auto;aspect-ratio:2/1;touch-action:none;cursor:grab}
.etools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.etool{background:var(--tile);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.etool.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill{font:inherit;color:inherit;cursor:pointer;font-weight:800;font-size:.9rem;background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:4px 12px;white-space:nowrap}
.rep{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 12px;border-radius:10px;background:var(--tile);width:100%}
.rep b{font-family:var(--display);font-weight:600}
.reps{display:flex;flex-direction:column;gap:6px;width:100%}
@media (prefers-reduced-motion:reduce){.shake,.mon,.hurt .mon{animation:none}.bar>div{transition:none}}
</style>
</head>

  if(G.kind==="sling"&&S&&solved){S.ammo++;SFX.ding();slingUI();toast("+1 shot! Pull back the sling.")}
  if(G.kind==="eng"&&S&&S.kind==="eng"&&solved){S.pending=true}

  if(G.kind==="bridge"&&S&&S.kind==="bridge"&&solved){S.bank++;toast("+1 plank! Watch it drop in.")}

/* Missing Letters and Unscramble share a tile builder */
function builder(o,gaps){
  var st=document.getElementById("stage"),word=o.w,L=word.split(""),n=L.length;
  var missing=[];
  if(gaps){var cnt=n<=4?1:(n<=8?2:3),pos=shuffle(L.map(function(_,i){return i})).slice(0,cnt);missing=pos}
  var slots=L.map(function(ch,i){var fixed=gaps&&missing.indexOf(i)<0;return{ch:ch,fixed:fixed,bi:fixed?-2:-1}});
  var need=gaps?missing.map(function(i){return L[i]}):L.slice();
  var extras=gaps?shuffle("abcdefghiklmnoprstuvy".split("").filter(function(c){return need.indexOf(c)<0})).slice(0,3):[];
  var bank=shuffle(need.concat(extras)).map(function(c){return{ch:c,used:false}});
  if(!gaps&&n>1){var tries=0;while(bank.map(function(b){return b.ch}).join("")===word&&tries++<10)bank=shuffle(bank)}
  var wrong=false,done=false;
  function draw(){
    st.innerHTML='<div class="tag">'+(gaps?"Fill in the missing letters":"Unscramble the letters")+'</div>'+
     '<div class="row">'+speakBtn(word,"Hear it")+speakBtn(o.x,"Sentence")+speakBtn(o.d,"Meaning")+'</div>'+
     '<div class="slots" id="slots">'+slots.map(function(s,i){
        if(s.fixed)return '<div class="slot fixed">'+s.ch+'</div>';
        if(s.bi>=0)return '<button class="slot filled" data-s="'+i+'" aria-label="Remove letter">'+bank[s.bi].ch+'</button>';
        return '<div class="slot" aria-label="Empty slot"></div>'}).join("")+'</div>'+
     '<div class="bank">'+bank.map(function(b,i){return '<button class="tile" data-b="'+i+'"'+(b.used||done?" disabled":"")+'>'+b.ch+'</button>'}).join("")+'</div>'+
     '<div class="row"><button class="btn ghost" id="clr"'+(done?" disabled":"")+'>Clear</button></div>';
    wireSpeak(st);
    st.querySelectorAll("[data-b]").forEach(function(b){b.onclick=function(){place(+b.dataset.b)}});
    st.querySelectorAll("[data-s]").forEach(function(b){b.onclick=function(){var s=slots[+b.dataset.s];bank[s.bi].used=false;s.bi=-1;draw()}});
    document.getElementById("clr").onclick=clear;
  }
  function clear(){slots.forEach(function(s){if(!s.fixed)s.bi=-1});bank.forEach(function(b){b.used=false});draw()}
  function place(bi){
    var s=slots.filter(function(s){return!s.fixed&&s.bi===-1})[0];if(!s)return;
    s.bi=bi;bank[bi].used=true;
    var full=slots.every(function(s){return s.fixed||s.bi>=0});
    if(!full)return draw();
    var built=slots.map(function(s){return s.fixed?s.ch:bank[s.bi].ch}).join("");
    if(built===word){done=true;draw();var first=!wrong;finish(word,first,true);feedback(true,word,first?"Correct on the first try!":"Correct!");}
    else{wrong=true;draw();var sl=document.getElementById("slots");sl.classList.add("shake");
      var fb=document.getElementById("fb");fb.innerHTML='<div class="fb info">Not quite. Check the order and try again.</div>';
      setTimeout(function(){sl.classList.remove("shake");clear()},650);}
  }
  draw();speak(word);
}

/* Sound */
var AC=null,soundOn=true;
try{soundOn=localStorage.getItem("twins_sound")!=="0"}catch(e){}
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC}catch(e){return null}}
function tone(f1,f2,dur,type,vol,delay){
  var c=ac();if(!c||!soundOn)return;var t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+dur);
  g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.03);

  var top=0;for(c=0;c<cols;c++)top=Math.max(top,h[c]+(mon[c]?1:0));

/* Bridge Engineer: spell a word right, then design a real bridge. Beams are springs, joints are pinned, gravity pulls,
   and a heavy truck drives across. Triangles stay strong; squares wobble. Beat the level and the next river is wider. */
var EU=40,EGR=600,ESUB=24,EMAXL=3.2,EJ0=-3,EJ1=2,EM0=3.2,EMD=0.3,EMMAX=9,ESAG=0.5;
var EMAT={
  road:{k:50000,ft:9000,fc:9000,w:.05,cost:3,col:"#c58a4e",edge:"#7a4f23",wd:9},
  steel:{k:100000,ft:30000,fc:45000,w:.08,cost:5,col:"#8795bd",edge:"#46527a",wd:5}
};
function engCfg(n){
  var G=Math.min(13,4+n);
  return{G:G,M:Math.min(EMMAX,EM0+n*EMD),walls:n<=4?2:1};
}
function engRef(G){
  var h=G<=5?1:G<=9?2:3,nodes=[],beams=[],i;
  function B(i1,j1,i2,j2,t){beams.push([i1,j1,i2,j2,t])}
  for(i=0;i<G;i++)B(i,0,i+1,0,"road");
  for(i=1;i<G;i++)B(i,0,i,-h,"steel");
  for(i=1;i<G-1;i++)B(i,-h,i+1,-h,"steel");
  B(0,0,1,-h,"steel");B(G,0,G-1,-h,"steel");
  for(i=1;i<G-1;i++){
    if(i+1<=G/2)B(i,-h,i+1,0,"steel");else B(i+1,-h,i,0,"steel");
  }
  return beams;
}
function engCost(len,type){return Math.max(1,Math.round(len/EU*EMAT[type].cost))}
function engRefCost(G){return engRef(G).reduce(function(s,b){return s+engCost(Math.hypot(b[2]-b[0],b[3]-b[1])*EU,b[4])},0)}
function engBudget(n,G){var mg=Math.max(1.35,2.3-n*.1);return Math.ceil(engRefCost(G)*mg/5)*5}
function engLevel(n){
  var c=engCfg(n),G=c.G;
  S.level=n;S.G=G;S.M=c.M;S.LX=Math.round((SW-G*EU)/2);S.RX=S.LX+G*EU;S.CY=190;S.WY=S.CY+Math.round(2.4*EU);S.Z=Math.min(1.6,600/(G*EU));S.OY=215;
  S.nodes=[];S.beams=[];S.sel=null;S.hist=[];S.hint=false;S.msg="";S.budget=engBudget(n,G);
  S.truck={x:26,y:S.CY,vy:0,ang:0,state:"wait",t:0,sup:null};
  var j;
  for(j=0;j<=c.walls;j++){engMk(0,j,true);engMk(G,j,true)}
  S.fx=[];S.sparks=[];
}
function engMk(i,j,fixed){
  var n={i:i,j:j,x:S.LX+i*EU,y:S.CY+j*EU,hx:0,hy:0,vx:0,vy:0,fx:0,fy:0,m:1,fixed:!!fixed};
  n.hx=n.x;n.hy=n.y;S.nodes.push(n);return n;
}
function engAt(i,j){for(var k=0;k<S.nodes.length;k++){var n=S.nodes[k];if(n.i===i&&n.j===j)return n}return null}
function engScr(x,y){return{x:(x-SW/2)*S.Z+SW/2,y:(y-S.CY)*S.Z+S.OY}}
function engGridOk(i,j){return i>=0&&i<=S.G&&j>=EJ0&&j<=EJ1}
function engSpent(){return S.beams.reduce(function(s,b){return s+b.cost},0)}
function engLeft(){return S.budget-engSpent()}
function engSnap(){
  return JSON.stringify({n:S.nodes.filter(function(n){return!n.fixed}).map(function(n){return[n.i,n.j]}),
    b:S.beams.map(function(b){return[b.A.i,b.A.j,b.B.i,b.B.j,b.type]})});
}
function engRestore(js){
  var d=JSON.parse(js);S.nodes=S.nodes.filter(function(n){return n.fixed});S.beams=[];S.sel=null;
  d.n.forEach(function(p){engMk(p[0],p[1],false)});
  d.b.forEach(function(p){engPush(engAt(p[0],p[1]),engAt(p[2],p[3]),p[4])});
}
function engPush(A,B,type){
  var L=Math.hypot(B.hx-A.hx,B.hy-A.hy);
  var b={A:A,B:B,type:type,L:L,cost:engCost(L,type),r:0,F:0,dead:false,k:0,c:0,ft:0,fc:0};
  S.beams.push(b);return b;
}
function engTry(A,gi,gj,type){
  if(!A){S.msg="Start from a dot.";return false}
  if(!engGridOk(gi,gj)){S.msg="Build between the cliffs.";return false}
  var Bn=engAt(gi,gj);
  if(A===Bn)return false;
  if(!Bn&&(gi===0||gi===S.G)){S.msg="Join the cliff at a bolt.";return false}
  var len=Math.hypot(gi-A.i,gj-A.j);
  if(len>EMAXL+1e-6){S.msg="Too long! A beam can reach about 3 squares.";return false}
  var cost=engCost(len*EU,type);
  if(cost>engLeft()){S.msg="Not enough money left for that beam.";return false}
  if(Bn&&S.beams.some(function(b){return(b.A===A&&b.B===Bn)||(b.A===Bn&&b.B===A)})){S.msg="There is already a beam there.";return false}
  S.hist.push(engSnap());if(S.hist.length>40)S.hist.shift();
  if(!Bn)Bn=engMk(gi,gj,false);
  engPush(A,Bn,type);S.msg="";SFX.plank();engUI();return Bn;
}
function engClean(){
  S.nodes=S.nodes.filter(function(n){return n.fixed||S.beams.some(function(b){return b.A===n||b.B===n})});
}
function engErase(x,y){
  var best=null,bd=14;
  S.beams.forEach(function(b){
    var ax=b.A.x,ay=b.A.y,bx=b.B.x,by=b.B.y,dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy)));
    var d=Math.hypot(x-(ax+dx*t),y-(ay+dy*t));if(d<bd){bd=d;best=b}
  });
  var nb=null,nd=14;
  S.nodes.forEach(function(n){if(n.fixed)return;var d=Math.hypot(x-n.x,y-n.y);if(d<nd){nd=d;nb=n}});
  if(!best&&!nb)return;
  S.hist.push(engSnap());
  if(nb)S.beams=S.beams.filter(function(b){return b.A!==nb&&b.B!==nb});else S.beams=S.beams.filter(function(b){return b!==best});
  engClean();S.sel=null;SFX.thud();engUI();
}
/* ---------- physics ---------- */
function engPrep(){
  S.nodes.forEach(function(n){n.m=.6;n.vx=n.vy=0;n.x=n.hx;n.y=n.hy});
  S.beams.forEach(function(b){var m=EMAT[b.type],w=m.w*b.L/EU;b.A.m+=w/2;b.B.m+=w/2;b.dead=false;b.r=0;b.F=0;
    b.k=m.k*EU/b.L;b.ft=m.ft;b.fc=m.fc*Math.min(1,1.2*EU/b.L)});
  S.beams.forEach(function(b){var ma=b.A.fixed?b.B.m:b.A.m,mb=b.B.fixed?b.A.m:b.B.m;b.c=2*.35*Math.sqrt(b.k*(ma*mb/(ma+mb)))});
  S.truck={x:26,y:S.CY,vy:0,ang:0,state:"drive",t:0,sup:null,out:""};
}
function engReset(){
  S.nodes.forEach(function(n){n.x=n.hx;n.y=n.hy;n.vx=n.vy=0});
  S.beams.forEach(function(b){b.dead=false;b.r=0;b.F=0});
  S.truck={x:26,y:S.CY,vy:0,ang:0,state:"wait",t:0,sup:null,out:""};
}
function engSupport(x){
  var best=null,by=1e9;
  for(var i=0;i<S.beams.length;i++){
    var b=S.beams[i];if(b.dead||b.type!=="road")continue;
    var x1=b.A.x,x2=b.B.x;if(x1>x2){var q=x1;x1=x2;x2=q}
    if(x<x1||x>x2||x2-x1<1)continue;
    var t=(x-b.A.x)/(b.B.x-b.A.x),y=b.A.y+(b.B.y-b.A.y)*t;
    if(y<by){by=y;best={b:b,t:t,y:y}}
  }
  return best;
}
function engSub(h){
  var N=S.nodes,B=S.beams,i,T=S.truck;
  for(i=0;i<N.length;i++){var n=N[i];n.fx=0;n.fy=n.fixed?0:n.m*EGR}
  for(i=0;i<B.length;i++){
    var b=B[i];if(b.dead)continue;
    var A=b.A,C=b.B,dx=C.x-A.x,dy=C.y-A.y,d=Math.sqrt(dx*dx+dy*dy)||1e-6,ux=dx/d,uy=dy/d;
    var Fe=b.k*(d-b.L),rv=(C.vx-A.vx)*ux+(C.vy-A.vy)*uy,F=Fe+b.c*rv;
    A.fx+=F*ux;A.fy+=F*uy;C.fx-=F*ux;C.fy-=F*uy;
    b.F=Fe;var r=Fe>=0?Fe/b.ft:-Fe/b.fc;b.r=b.r*.85+r*.15;
    if(b.r>1){b.dead=true;S.snap=true;if(S.sparks.length<80)for(var k=0;k<6;k++)S.sparks.push({x:(A.x+C.x)/2,y:(A.y+C.y)/2,vx:(Math.random()-.5)*5,vy:-Math.random()*4,life:30,c:EMAT[b.type].col})}
  }
  if(T.sup){
    var sb=T.sup.b;
    if(!sb.dead){var W=S.M*EGR,t=T.sup.t;sb.A.fy+=W*(1-t);sb.B.fy+=W*t}
  }
  for(i=0;i<N.length;i++){
    var m=N[i];if(m.fixed)continue;
    m.vx+=m.fx/m.m*h;m.vy+=m.fy/m.m*h;m.vx*=.9985;m.vy*=.9985;
    m.x+=m.vx*h;m.y+=m.vy*h;
  }
}
function engStepFrame(){
  var T=S.truck,i;
  if(T.state==="drive"){
    T.x+=S.speed||2.6;
    var s=T.x>S.LX&&T.x<S.RX?engSupport(T.x):null;
    if(s){T.sup=s;T.y=s.y;var b=s.b;T.ang=Math.atan2(b.B.y-b.A.y,b.B.x-b.A.x);if(T.ang>1.2||T.ang<-1.2)T.ang=0;if(b.B.x<b.A.x)T.ang=Math.atan2(b.A.y-b.B.y,b.A.x-b.B.x)}
    else if(T.x<=S.LX||T.x>=S.RX){T.sup=null;T.y=S.CY;T.ang=0}
    else{T.sup=null;T.vy+=.55;T.y+=T.vy;T.ang=Math.min(.5,T.ang+.02);T.state="lost";T.out="fell";SFX.crack()}
    if(T.state==="drive"&&T.y>S.CY+EU*ESAG){T.state="lost";T.out="sag";T.sup=null;SFX.crack()}
    if(T.state==="drive"&&T.x>=S.RX+EU*1.6){T.state="won"}
  }else if(T.state==="lost"){
    T.sup=null;T.vy+=.55;T.y+=T.vy;
  }
  var h=1/60/ESUB;
  for(i=0;i<ESUB;i++)engSub(h);
  if(S.snap){S.snap=false;if(sfxRate("snap",6))SFX.crack()}
  if(T.state==="won"||T.state==="lost"){T.t++;
    if(T.t===60){engResult(T.state==="won")}}
}
function engCheck(){ /* run a whole trip instantly: used by tests */
  engPrep();var n=0;while(S.truck.t<62&&n<4000){engStepFrame();n++}
  var T=S.truck;return{won:T.state==="won",out:T.out,dead:S.beams.filter(function(b){return b.dead}).length,maxr:Math.max.apply(null,[0].concat(S.beams.map(function(b){return b.r})))}
}
function etick(){
  S.f++;
  S.sparks.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.life--});S.sparks=S.sparks.filter(function(p){return p.life>0});
  if(S.mode==="test"||S.mode==="result")engStepFrame();

}
/* ---------- drawing ---------- */
function engCol(r){r=Math.max(0,Math.min(1,r));return"hsl("+Math.round(205-205*r)+",78%,"+(46+8*(1-r))+"%)"}
function edraw(){

  c.save();c.translate(SW/2,S.OY);c.scale(S.Z,S.Z);c.translate(-SW/2,-CY);
  c.fillStyle="#3b82c4";c.fillRect(LX,WY,RX-LX,700);
  c.strokeStyle="rgba(255,255,255,.55)";c.lineWidth=2;c.lineCap="round";
  for(var wx=LX+14;wx<RX-14;wx+=36){var wy=WY+18+Math.sin((S.f+wx)*.07)*3;c.beginPath();c.moveTo(wx,wy);c.quadraticCurveTo(wx+9,wy-5,wx+18,wy);c.stroke()}
  c.fillStyle="#7b5a3c";c.fillRect(-700,CY,LX+700,700);c.fillRect(RX,CY,SW-RX+700,700);
  c.fillStyle="#5a9b5f";c.fillRect(-700,CY,LX+700,9);c.fillRect(RX,CY,SW-RX+700,9);
  c.strokeStyle="rgba(0,0,0,.12)";c.lineWidth=2;
  for(var sy=CY+50;sy<CY+400;sy+=46){c.beginPath();c.moveTo(-700,sy);c.lineTo(LX-6,sy+4);c.moveTo(RX+6,sy+4);c.lineTo(SW+700,sy);c.stroke()}
  var editing=S.mode==="edit";
  if(editing){
    c.fillStyle="rgba(19,32,67,.22)";
    for(var gi=1;gi<S.G;gi++)for(var gj=EJ0;gj<=EJ1;gj++){c.beginPath();c.arc(LX+gi*EU,CY+gj*EU,2.2,0,6.283);c.fill()}

  }

    c.strokeStyle=testing?engCol(b.r):m.col;c.lineWidth=m.wd;c.beginPath();c.moveTo(b.A.x,b.A.y);c.lineTo(b.B.x,b.B.y);c.stroke();
  });
  if(S.mode==="edit"&&S.pd&&S.pd.n&&S.pm){
    var g=S.hoverG,ok=g&&engGridOk(g.i,g.j)&&Math.hypot(g.i-S.pd.n.i,g.j-S.pd.n.j)<=EMAXL+1e-6;
    c.setLineDash([5,5]);c.lineWidth=4;c.strokeStyle=ok?(S.tool==="steel"?EMAT.steel.edge:EMAT.road.edge):"#c62f3d";
    c.beginPath();c.moveTo(S.pd.n.x,S.pd.n.y);if(g)c.lineTo(LX+g.i*EU,CY+g.j*EU);else c.lineTo(S.pm.x,S.pm.y);c.stroke();c.setLineDash([]);
  }
  S.nodes.forEach(function(n){
    c.beginPath();
    if(n.fixed){c.fillStyle="#46527a";c.fillRect(n.x-6,n.y-6,12,12);c.fillStyle="#fff";c.beginPath();c.arc(n.x,n.y,2.2,0,6.283);c.fill()}
    else{c.fillStyle="#fff";c.strokeStyle="#132043";c.lineWidth=2.5;c.arc(n.x,n.y,6,0,6.283);c.fill();c.stroke()}
    if(S.sel===n&&editing){c.strokeStyle="#f5a800";c.lineWidth=3.5;c.beginPath();c.arc(n.x,n.y,11,0,6.283);c.stroke()}
  });
  if(editing&&S.hoverG&&engGridOk(S.hoverG.i,S.hoverG.j)){c.strokeStyle="rgba(47,91,234,.7)";c.lineWidth=2;c.beginPath();c.arc(LX+S.hoverG.i*EU,CY+S.hoverG.j*EU,9,0,6.283);c.stroke()}
  etruck(c,S.truck);
  S.sparks.forEach(function(p){c.globalAlpha=Math.max(0,p.life/30);c.fillStyle=p.c;c.fillRect(p.x-2,p.y-2,4,4)});c.globalAlpha=1;
  c.restore();
  if(S.celebrate>0){c.globalAlpha=Math.min(1,S.celebrate/30);c.font="800 44px Fredoka, sans-serif";c.textAlign="center";c.fillStyle="#f5a800";c.strokeStyle="#132043";c.lineWidth=6;c.strokeText("Bridge built!",SW/2,90);c.fillText("Bridge built!",SW/2,90);c.globalAlpha=1;c.textAlign="start"}
}
function etruck(c,T){
  c.save();c.translate(T.x,T.y);c.rotate(T.ang||0);
  c.fillStyle="#e8503a";c.strokeStyle="#132043";c.lineWidth=2;
  c.beginPath();c.rect(-28,-30,38,20);c.fill();c.stroke();
  c.fillStyle="#f58a3a";c.beginPath();c.moveTo(10,-30);c.lineTo(22,-30);c.lineTo(30,-18);c.lineTo(30,-10);c.lineTo(10,-10);c.closePath();c.fill();c.stroke();
  c.fillStyle="#bfe3ff";c.fillRect(14,-27,8,8);
  c.fillStyle="#2b2f45";[-16,18].forEach(function(wx){c.beginPath();c.arc(wx,-8,8,0,6.283);c.fill();c.fillStyle="#cfd4e6";c.beginPath();c.arc(wx,-8,3,0,6.283);c.fill();c.fillStyle="#2b2f45"});
  c.fillStyle="#132043";c.font="800 11px Nunito, sans-serif";c.textAlign="center";c.fillText(S.M.toFixed(0)+" t",-9,-16);c.textAlign="start";
  c.restore();
}
/* ---------- screens ---------- */
function buildEng(){
  app.innerHTML='<div class="row"><button class="btn ghost" id="quit">Home</button><span class="pill" id="e-lvl"></span><span class="pill" id="e-bud"></span><span class="pill" id="e-trip"></span><button class="pill" id="snd" aria-pressed="true"></button></div>'+
   '<div class="arena"><canvas id="cv" aria-label="Bridge Engineer. Build a bridge so the truck can cross the river."></canvas></div><p class="sentence" id="aimhint"></p><div id="qa"></div>';
  var cv=document.getElementById("cv"),dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=SW*dpr;cv.height=SH*dpr;
  S={kind:"eng",cv:cv,ctx:cv.getContext("2d"),dpr:dpr,cleared:0,mode:"idle",tool:"road",pending:false,trips:0,celebrate:0,last:0,acc:0,stop:false,raf:0,f:0,speed:2.6,sf:{}};
  engLevel(1);
  document.getElementById("quit").onclick=function(){stopArena();home()};
  var sb=document.getElementById("snd");
  function sbl(){sb.textContent="Sound: "+(soundOn?"On":"Off");sb.setAttribute("aria-pressed",soundOn?"true":"false")}
  sb.onclick=function(){soundOn=!soundOn;try{localStorage.setItem("twins_sound",soundOn?"1":"0")}catch(e){}sbl();if(soundOn)SFX.ding()};
  sbl();
  function pt(ev){var r=cv.getBoundingClientRect(),sx=(ev.clientX-r.left)*SW/r.width,sy=(ev.clientY-r.top)*SH/r.height;return{x:(sx-SW/2)/S.Z+SW/2,y:(sy-S.OY)/S.Z+S.CY}}
  function snap(p){var i=Math.round((p.x-S.LX)/EU),j=Math.round((p.y-S.CY)/EU);return engGridOk(i,j)&&Math.hypot(p.x-(S.LX+i*EU),p.y-(S.CY+j*EU))<EU*.55?{i:i,j:j}:null}
  cv.addEventListener("pointerdown",function(ev){
    if(!S||S.mode!=="edit")return;ev.preventDefault();var p=pt(ev);
    try{cv.setPointerCapture(ev.pointerId)}catch(e){}
    if(S.tool==="erase"){engErase(p.x,p.y);return}
    var g=snap(p);S.pm=p;S.hoverG=g;
    S.pd={n:g?engAt(g.i,g.j):null,x:p.x,y:p.y};
    if(!S.pd.n&&!S.sel)S.msg="Start from a dot or bolt (tap a joint first).";
    engUI();
  });
  cv.addEventListener("pointermove",function(ev){
    if(!S||S.mode!=="edit")return;var p=pt(ev);S.pm=p;S.hoverG=snap(p);
  });
  cv.addEventListener("pointerup",function(ev){
    if(!S||S.mode!=="edit"||S.tool==="erase")return;ev.preventDefault();
    var p=pt(ev),g=snap(p),st=S.pd;S.pd=null;S.pm=null;
    if(!g){S.msg="Let go on a dot.";engUI();return}
    var nUp=engAt(g.i,g.j);
    if(st&&st.n&&st.n!==nUp){S.sel=null;engTry(st.n,g.i,g.j,S.tool)}
    else if(st&&st.n&&st.n===nUp){
      if(S.sel&&S.sel!==nUp){var a=S.sel;S.sel=null;var nb=engTry(a,g.i,g.j,S.tool);if(nb)S.sel=nb}
      else S.sel=S.sel===nUp?null:nUp;
    }else if(S.sel){var a2=S.sel;S.sel=null;var nb2=engTry(a2,g.i,g.j,S.tool);if(nb2)S.sel=nb2}
    engUI();
  });
  cv.addEventListener("pointercancel",function(){if(S){S.pd=null;S.pm=null}});
  engUI();S.raf=requestAnimationFrame(loop);
}
function engUI(){
  if(!S||S.kind!=="eng")return;
  var a=function(id,t){var e=document.getElementById(id);if(e)e.textContent=t};
  a("e-lvl","Level "+S.level+" | Bridges: "+S.cleared);
  a("e-bud","Money: $"+engLeft()+" / $"+S.budget);
  a("e-trip",S.mode==="idle"?"Truck trips: 0":"Truck trips: "+S.trips);
  var h="";
  if(S.mode==="idle")h=S.pending?"":(S.beams.length?"Your bridge is waiting. Spell a word right to work on it.":"Spell a word right to earn a turn building a bridge.");
  else if(S.mode==="edit")h=S.msg||(S.beams.length?"Triangles make a bridge strong. Test it when you are ready.":"Join the bolts across the river. Drag from a dot to another dot. Brown road is for the truck to drive on.");
  else if(S.mode==="test")h="Here comes the "+S.M.toFixed(0)+" ton truck...";
  else h=S.result||"";
  a("aimhint",h);
  document.querySelectorAll(".etool").forEach(function(b){b.classList.toggle("on",b.dataset.t===S.tool)});
}
function engWorkshop(){
  S.mode="edit";S.trips=2;S.msg="";S.result="";engReset();
  var qa=document.getElementById("qa");
  qa.innerHTML='<section class="card"><div class="tag">Your turn to build. Make it strong enough for the truck!</div>'+
   '<div class="etools"><button class="btn etool" data-t="road">Road</button><button class="btn etool" data-t="steel">Steel</button><button class="btn etool" data-t="erase">Erase</button>'+
   '<button class="btn ghost" id="e-undo">Undo</button><button class="btn ghost" id="e-clear">Clear</button><button class="btn ghost" id="e-hint">Hint</button></div>'+
   '<p class="sentence" style="margin:10px 0 0">Road is cheap and the truck drives on it. Steel is stronger and costs more. Beams can be about 3 squares long. Green lines in Hint show one way to do it.</p>'+
   '<div class="row" style="margin-top:12px"><button class="btn" id="e-test">Test the truck</button><button class="btn ghost" id="e-back">Back to spelling</button></div></section>';
  qa.querySelectorAll(".etool").forEach(function(b){b.onclick=function(){S.tool=b.dataset.t;S.sel=null;S.msg="";engUI()}});
  document.getElementById("e-undo").onclick=function(){if(S.mode!=="edit"||!S.hist.length)return;engRestore(S.hist.pop());engUI()};
  document.getElementById("e-clear").onclick=function(){if(S.mode!=="edit"||!S.beams.length)return;S.hist.push(engSnap());S.beams=[];engClean();S.sel=null;engUI()};
  document.getElementById("e-hint").onclick=function(){S.hint=!S.hint;this.textContent=S.hint?"Hide hint":"Hint"};
  document.getElementById("e-test").onclick=engTest;
  document.getElementById("e-back").onclick=engClose;
  engUI();
}
function engTest(){
  if(S.mode!=="edit")return;
  if(!S.beams.some(function(b){return b.type==="road"})){S.msg="The truck needs a road. Build some brown road beams across the river.";engUI();return}
  S.trips--;S.sel=null;S.pd=null;S.mode="test";S.hint=false;
  engPrep();SFX.pop();
  var qa=document.getElementById("qa");qa.innerHTML='<section class="card"><div class="tag">Testing</div><p class="sentence">Beams turn from blue to red as they carry more load.</p></section>';
  engUI();
}
function engResult(won){
  if(!S||S.kind!=="eng")return;
  S.mode="result";var qa=document.getElementById("qa");
  if(won){
    S.cleared++;unlock("eng_win");if(S.cleared>=5)unlock("eng_all");
    S.celebrate=90;SFX.level();
    S.result="You did it! The truck made it across.";
    qa.innerHTML='<section class="card prompt"><div class="tag">Bridge '+S.cleared+' built</div><h2>The truck made it across!</h2><p class="sentence">Next up: a wider river and a heavier truck.</p><div class="row"><button class="btn" id="e-go">Keep going</button></div></section>';
    document.getElementById("e-go").onclick=function(){S.level++;engLevel(S.level);engClose()};
  }else{
    var why=S.truck.out==="sag"?"The bridge sagged too low.":S.truck.out==="fell"?"There was a gap in the road.":"The bridge broke.";
    var broke=S.beams.filter(function(b){return b.dead}).length;
    S.result=why;
    var hint=broke>0?"Red beams were carrying too much. Add triangles near where it broke.":"Make sure brown road beams connect from one cliff bolt to the other.";
    qa.innerHTML='<section class="card prompt"><div class="tag">Not yet</div><h2>'+why+'</h2><p class="sentence">'+hint+(S.trips>0?" You have "+S.trips+" more truck trip"+(S.trips===1?"":"s")+" for this word.":" Spell the next word to try again.")+'</p><div class="row">'+(S.trips>0?'<button class="btn" id="e-fix">Fix my bridge</button>':'')+'<button class="btn ghost" id="e-back">Back to spelling</button></div></section>';
    var f=document.getElementById("e-fix");if(f)f.onclick=function(){var t=S.trips;engWorkshop();S.trips=t;engUI()};
    document.getElementById("e-back").onclick=function(){engReset();engClose()};
  }
  engUI();
}
function engClose(){
  S.mode="idle";S.pending=false;S.sel=null;S.pd=null;S.hint=false;engReset();engUI();
  G.i>=G.items.length?engineerDone():engineerStep();
}
function engineerStep(){
  if(!S)buildEng();
  if(S.pending&&S.mode==="idle")return engWorkshop();
  if(G.i>=G.items.length)return engineerDone();
  S.mode="idle";engUI();
  var it=G.items[G.i];
  document.getElementById("qa").innerHTML='<section class="card prompt" id="stage"></section><div id="fb"></div>';
  if(it.mg==="listen")listen(it.o);else builder(it.o,it.mg==="gaps");
}
function engineerDone(){
  var qa=document.getElementById("qa");if(!qa||!S)return;
  qa.innerHTML='<section class="card prompt"><div class="tag">Bridge Engineer</div><h2>All words done. You built '+S.cleared+' bridge'+(S.cleared===1?"":"s")+'.</h2><div class="row"><button class="btn" id="fin">Finish game</button></div></section>';
  document.getElementById("fin").onclick=engineerEnd;
  engUI();
}
function engineerEnd(){
  var br=S?S.cleared:0,lv=S?S.level:1,n=G.items.length;
  var uniq=G.missed.filter(function(w,i){return G.missed.indexOf(w)===i});
  stopArena();
  app.innerHTML='<section class="card prompt"><div class="tag">Bridge Engineer results</div><div class="score">'+br+' bridge'+(br===1?"":"s")+'</div>'+
   '<h2>'+(br>=5?"Master Engineer! 5 or more bridges built.":br>0?"Nice engineering! You reached level "+lv+".":"Good try. Triangles make bridges strong. Play again!")+'</h2>'+
   '<p class="sentence">Spelled right on the first try: <span class="hit">'+G.right+'</span> of '+n+'. Best streak: <b>'+(G.best||0)+'</b>.'+(uniq.length?'<br>Words to practice: <span class="miss">'+uniq.join(", ")+'</span>':'')+'</p>'+
   '<div class="row"><button class="btn" id="again">Play again</button>'+(uniq.length?'<button class="btn ghost" id="fix">Practice missed words</button>':'')+'<button class="btn ghost" id="hm">Home</button></div></section>';
  document.getElementById("again").onclick=function(){start("eng")};
  var fx=document.getElementById("fix");if(fx)fx.onclick=function(){practiceMissed(uniq)};
  document.getElementById("hm").onclick=home;
}

/* Arcade Games: every word spelled earns plays in a quick game (shared minigames.js). Pick the game from the list above the word. */
var MGI=null;
function arcadeStep(){
  if(!MGI){
    app.innerHTML='<div class="row"><button class="btn ghost" id="quit">Home</button><div class="bar" role="progressbar"><div id="ar-bar" style="width:0%"></div></div><span class="tag" id="ar-tag"></span><span class="chip" id="streak"></span></div><div id="mgbox"></div><div id="qa"></div>';
    document.getElementById("quit").onclick=function(){stopArena();home()};
    var last="balloon";try{last=localStorage.getItem("twins_arcade")||"balloon"}catch(e){}
    try{MGI=MiniGames.mount(document.getElementById("mgbox"),{game:last,select:true,onChange:function(v){try{localStorage.setItem("twins_arcade",v)}catch(e){}}})}catch(e){MGI=null}
  }
  var pct=Math.round(G.i/G.items.length*100);
  document.getElementById("ar-bar").style.width=pct+"%";
  document.getElementById("ar-tag").textContent=Math.min(G.i+1,G.items.length)+" / "+G.items.length;
  if(G.i>=G.items.length)return arcadeDone();
  var it=G.items[G.i];
  document.getElementById("qa").innerHTML='<section class="card prompt" id="stage"></section><div id="fb"></div>';
  if(it.mg==="listen")listen(it.o);else builder(it.o,it.mg==="gaps");
}
function arcadeDone(){
  var qa=document.getElementById("qa");if(!qa)return;
  qa.innerHTML='<section class="card prompt"><div class="tag">Arcade Games</div><h2>All words done. Great spelling!</h2><div class="row"><button class="btn" id="fin">Finish game</button></div></section>';
  document.getElementById("fin").onclick=arcadeEnd;
}
function arcadeEnd(){
  var n=G.items.length,uniq=G.missed.filter(function(w,i){return G.missed.indexOf(w)===i});
  stopArena();
  app.innerHTML='<section class="card prompt"><div class="tag">Arcade Games results</div><div class="score">'+G.right+' / '+n+'</div>'+
   '<h2>'+(G.right===n?"Perfect spelling!":G.right>=n*.8?"Great job!":"Nice work. Keep practicing!")+'</h2>'+
   '<p class="sentence">Spelled right on the first try: <span class="hit">'+G.right+'</span> of '+n+'. Best streak: <b>'+(G.best||0)+'</b>.'+(uniq.length?'<br>Words to practice: <span class="miss">'+uniq.join(", ")+'</span>':'')+'</p>'+
   '<div class="row"><button class="btn" id="again">Play again</button>'+(uniq.length?'<button class="btn ghost" id="fix">Practice missed words</button>':'')+'<button class="btn ghost" id="hm">Home</button></div></section>';
  document.getElementById("again").onclick=function(){start("arcade")};
  var fx=document.getElementById("fix");if(fx)fx.onclick=function(){practiceMissed(uniq)};
  document.getElementById("hm").onclick=home;
}

/* Study cards */
function flash(o){
  app.innerHTML=header()+'<section class="card prompt"><div class="tag">Study card</div><div class="big">'+o.w+'</div><div class="syl">'+o.s+'</div>'+
   '<p class="sentence"><b>Meaning:</b> '+esc(o.d)+'</p><p class="sentence">'+esc(o.x)+'</p><div class="row">'+speakBtn(o.w,"Say the word")+speakBtn(o.w.split("").join(", "),"Spell it out loud")+speakBtn(o.x,"Sentence")+speakBtn(o.d,"Meaning")+'</div></section>'+
   '<div class="row"><button class="btn ghost" id="pv"'+(G.i===0?" disabled":"")+'>Back</button><button class="btn" id="nx">'+(G.i>=G.items.length-1?"Finish":"Next word")+'</button></div>';
  document.getElementById("quit").onclick=home;wireSpeak(app);speak(o.w);
  document.getElementById("pv").onclick=function(){G.i=Math.max(0,G.i-1);step()};
  document.getElementById("nx").onclick=function(){G.i++;step()};
}

function end(){
  if(G.kind==="boss")return bossEnd();
  if(G.kind==="testday")return testEnd();
  if(G.kind==="flash"){
    app.innerHTML='<section class="card prompt"><h2>Nice studying!</h2><p class="sentence">Now test yourself. Try Listen and Spell next.</p><div class="row"><button class="btn" id="go">Listen and Spell</button><button class="btn ghost" id="hm">Home</button></div></section>';
    document.getElementById("go").onclick=function(){start("listen")};document.getElementById("hm").onclick=home;return;
  }
  var n=G.items.length,r=G.right,msg=r===n?"Perfect round!":r>=n*.8?"Great work!":r>=n*.5?"Good effort. Keep going!":"Keep practicing. You will get there!";
  var uniq=G.missed.filter(function(w,i){return G.missed.indexOf(w)===i});
  if(n>=10&&r===n)unlock("perfect");
  app.innerHTML='<section class="card prompt"><div class="tag">Round complete</div><div class="score">'+r+' / '+n+'</div><h2>'+msg+'</h2>'+
   '<p class="sentence">Right on the first try: <span class="hit">'+r+'</span><br>Best streak: <b>'+(G.best||0)+'</b>'+(uniq.length?'<br>Practice these again: <span class="miss">'+uniq.join(", ")+'</span>':'')+'</p>'+
   '<div class="row"><button class="btn" id="again">Play again</button>'+(uniq.length&&G.kind!=="thenthan"?'<button class="btn ghost" id="fix">Practice missed words</button>':'')+'<button class="btn ghost" id="hm">Home</button></div></section>';
  var kind=G.kind,missed=uniq;
  document.getElementById("again").onclick=function(){start(kind)};
  var fx=document.getElementById("fix");
  if(fx)fx.onclick=function(){G={kind:kind,items:shuffle(missed).map(function(w){return{o:WORDS.filter(function(o){return o.w===w})[0]}}),i:0,right:0,missed:[]};step()};
  document.getElementById("hm").onclick=home;
}
hub();
