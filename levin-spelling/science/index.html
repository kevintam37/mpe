<html lang="en">
<head>

<title>Science: Unit 1 Review</title>

<style>
:root{
  --bg:#eef3fb; --surface:#ffffff; --ink:#132043; --muted:#5b6788; --line:#d5dded;
  --accent:#2f5bea; --accent-ink:#ffffff; --gold:#f5a800; --good:#178a4c; --good-bg:#dff5e8; --bad:#c62f3d; --bad-bg:#fde3e5;
  --tile:#e3ebfd; --mark:#fff0b3; --shadow:0 2px 0 rgba(19,32,67,.12);
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1730; --surface:#18234a; --ink:#eaf0ff; --muted:#a1aed3; --line:#2c3a6b;
  --accent:#7d9bff; --accent-ink:#0f1730; --gold:#ffc23d; --good:#5fd394; --good-bg:#12382a; --bad:#ff8892; --bad-bg:#3d1b24;
  --tile:#25336a; --mark:#5a4a12; --shadow:0 2px 0 rgba(0,0,0,.4); color-scheme:dark}}:root[data-theme="dark"]{
  --bg:#0f1730; --surface:#18234a; --ink:#eaf0ff; --muted:#a1aed3; --line:#2c3a6b;
  --accent:#7d9bff; --accent-ink:#0f1730; --gold:#ffc23d; --good:#5fd394; --good-bg:#12382a; --bad:#ff8892; --bad-bg:#3d1b24;
  --tile:#25336a; --mark:#5a4a12; --shadow:0 2px 0 rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.45;padding:20px 16px 90px}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;font-weight:600}
h1{font-size:2rem}h2{font-size:1.35rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tag{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}

.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.4;cursor:default}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.topic{display:flex;flex-direction:column;gap:8px}
.topic p{margin:0;color:var(--muted);font-size:.95rem;font-weight:700}
.topic .last{font-size:.85rem}
.bar{height:10px;background:var(--tile);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.sent{display:flex;flex-wrap:wrap;gap:6px 4px;font-family:var(--display);font-size:1.35rem;line-height:1.9;margin:4px 0 8px}
.tok{border:0;background:transparent;padding:2px 6px;border-radius:8px;font:inherit;color:inherit;box-shadow:none}
.tok:not(:disabled){cursor:pointer}
.tok:not(:disabled):hover{background:var(--tile)}
.tok.m-ul{border-bottom:4px solid var(--accent);border-radius:0}
.tok.m-circle{outline:3px solid var(--accent);outline-offset:0;border-radius:99px}
.tok.m-hl{background:var(--mark)}
.tok.m-box{outline:3px dashed var(--accent);border-radius:6px}
.tok.ok{background:var(--good-bg);color:var(--good)}
.tok.bad{background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.tok.miss{outline:3px dashed var(--good);outline-offset:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:800;font-size:.95rem}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip small{font-weight:700;opacity:.85}
.opts{display:grid;gap:10px;margin:10px 0}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--tile);border:3px solid transparent;border-radius:14px;padding:12px 14px;font-weight:700}
.opt.sel{border-color:var(--accent)}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt b{font-family:var(--display);min-width:1.4em}
.choicerow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.stem{font-size:1.2rem;font-weight:700;margin:2px 0 6px}
.stem u{text-decoration-thickness:3px;text-underline-offset:4px}
.pair{background:var(--tile);border-radius:12px;padding:10px 14px;margin:8px 0;font-weight:700}
.fb{border-radius:14px;padding:12px 14px;margin-top:10px;font-weight:700}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb span{color:var(--ink);font-weight:600;display:block;margin-top:4px}
.rv{border:2px solid var(--line);border-left:8px solid var(--good);border-radius:14px;padding:12px 14px;background:var(--surface);margin-bottom:10px}.rv.rno{border-left-color:var(--bad)}.rv .opt{cursor:default}.rv .sent{font-size:1.15rem}.rvh{margin-bottom:6px}
.score{font-family:var(--display);font-size:2.6rem;color:var(--accent)}
.miss-list{display:grid;gap:8px;margin:10px 0}
.miss-list div{background:var(--tile);border-radius:12px;padding:10px 14px;font-weight:600;font-size:.98rem}
textarea{width:100%;min-height:200px;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:var(--surface);color:var(--ink);resize:vertical}
.check li{margin:6px 0;font-weight:700}
.check .y{color:var(--good)}.check .n{color:var(--bad)}
.small{font-size:.9rem;color:var(--muted);font-weight:600}
.review .ri{border:2px solid var(--line);border-left:8px solid var(--good);border-radius:14px;padding:12px 14px;background:var(--surface);margin-bottom:10px}.review .ri.nor{border-left-color:var(--bad)}.review .rh{margin-bottom:6px}
.opt b{font-family:var(--display)}.opt svg{display:block;color:var(--ink)}.opt>span{flex:1}
</style>

(function(){

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

/* multiple choice: correct answer plus wrong ones, shuffled */
function MC(R,stem,right,wrongs,exp,extra){
  var w=[];R.shuffle(wrongs).forEach(function(x){if(x!==right&&w.indexOf(x)<0&&w.length<3)w.push(x)});

/* short answer graded by key words */

function norm(s){return " "+String(s).toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim()+" "}

  q.groups.forEach(function(g){if(g.some(function(a){return n.indexOf(norm(a).trim())>=0}))hit++});
  return hit>=q.need}
/* particle pictures */

  else if(state==="liquid"){var tries=0;while(pts.length<14&&tries++<400){var x=R.int(14,116),y=R.int(34,86);if(pts.every(function(p){return Math.hypot(p[0]-x,p[1]-y)>19}))pts.push([x,y])}}

  return '<svg viewBox="0 0 130 100" width="130" height="100" role="img" aria-label="particle picture"><rect x="2" y="2" width="126" height="96" rx="6" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="2"/>'+
    pts.map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="8.5" fill="#2f7dd1" stroke="#1b4f8f" stroke-width="1.5"/>'}).join("")+'</svg>'}

/* ======= TOPIC 1: matter and conservation ======= */
var REACT=[["a log","oxygen","ash, smoke and gases"],["steel wool","oxygen","rust (iron oxide)"],["baking soda","vinegar","gas bubbles and liquid"],["a candle","oxygen","carbon dioxide and water vapor"]];
function poolMatter(R){var mc=[],sa=[];
  mc.push(MC(R,"Which is the best definition of <b>matter</b>?","Anything that has mass and takes up space",["Anything that can be seen with your eyes","Anything that can move on its own","Anything that is solid and heavy","Anything that gives off light"],"Matter is anything that has mass and takes up space (volume)."));

  mc.push(MC(R,"What does the <b>Law of Conservation of Matter</b> say?","Matter cannot be created or destroyed; the total amount stays the same",["Matter can be created but not destroyed","Matter is destroyed when it burns","The mass of the products is always less than the reactants","Matter is only conserved when it is a solid"],"The total amount of matter always stays the same, even when matter changes form."));
  mc.push(MC(R,"In a chemical reaction, how does the mass of the <b>reactants</b> compare with the mass of the <b>products</b>?","They are equal",["The reactants have more mass","The products always have more mass","It depends on the color","There is no way to compare them"],"The mass of the stuff you START WITH equals the mass of the stuff you END UP WITH."));
  mc.push(MC(R,"In the picture, wood burns in oxygen and makes ash and smoke. The wood and the oxygen are called the ______.","reactants",["products","reaction","solids","energy"],"The starting materials are the reactants. What you end up with are the products."));
  mc.push(MC(R,"In the burning log picture, the ash and smoke are called the ______.","products",["reactants","oxygen","fuel","reaction"],"Products are the new substances that form in a reaction."));
  for(var n=0;n<4;n++){var a=R.pick([10,12,15,18,20,24,25,30,36,40,45,50]),b=R.pick([5,8,10,14,16,20,22,32]),sc=R.pick(REACT),t=a+b;
    mc.push(MC(R,"A closed container holds "+a+" g of "+sc[0]+" and "+b+" g of "+sc[1]+". They react completely. What is the total mass of the products?",t+" g",[(t-b)+" g",(t+b)+" g",Math.abs(a-b)+" g",(t-5)+" g",(t+10)+" g"],a+" g + "+b+" g = "+t+" g. Mass is conserved, so the products have the same total mass.",{key:a+"-"+b+sc[0]}))}
  var pm=R.pick([[200,"ice","water"],[150,"ice","water"],[80,"snow","water"],[120,"ice","water"]]);
  mc.push(MC(R,pm[0]+" g of "+pm[1]+" melts and becomes "+pm[2]+". What is the mass of the "+pm[2]+"?",pm[0]+" g",[Math.round(pm[0]/2)+" g",(pm[0]+50)+" g","0 g",(pm[0]-30)+" g"],"No matter is created or destroyed, so the mass stays "+pm[0]+" g.",{key:"pm"+pm[0]+pm[1]}));
  mc.push(MC(R,"A student burns a log in an open fire and the ashes weigh less than the log. Where did the rest of the matter go?","Into gases and smoke that went into the air",["It was destroyed","It turned into energy only","It disappeared","It stayed inside the ash"],"Matter is not lost. Some of it became gases and smoke that escaped into the air."));
  var amt=R.pick([25,36,40,48,60,72]);
  sa.push(SA("What is matter?",[["mass"],["space","volume"]],"Matter is anything that has mass and takes up space (volume)."));
  sa.push(SA("Explain the Law of Conservation of Matter in your own words.",[["creat","made","make","new matter"],["destroy","disappear","lost","gone"]],"Matter cannot be created or destroyed. The total amount of matter always stays the same, even when it changes form."));
  sa.push(SA("Name one <b>reactant</b> and one <b>product</b> when wood burns.",[["wood","log","oxygen"],["ash","smoke","gas","carbon dioxide","soot"]],"Reactants: wood and oxygen. Products: ash, smoke and gases."));
  sa.push(SA("A closed jar has <b>"+amt+" g</b> of reactants. After a chemical reaction, what is the mass of everything in the jar? Explain.",[[String(amt)],["same","equal","conserv","no change","not change","stay"]],amt+" g. The mass of the stuff you start with equals the mass of the stuff you end up with.",2,{key:"amt"+amt}));
  sa.push(SA("Why does a burned log seem to weigh less than it did before it burned?",[["gas","smoke","air","carbon dioxide","vapor"]],"Some of the matter turned into gases and smoke that escaped into the air. The total mass of all the products still equals the starting mass."));
  sa.push(SA("Complete the sentence: The mass of the stuff you ______ with equals the mass of the stuff you ______ with.",[["start","begin"],["end"]],"The mass of the stuff you START with equals the mass of the stuff you END UP with."));

/* ======= TOPIC 2: properties of matter ======= */
var DENS=[["a cork",0.25],["a pine board",0.55],["a piece of ice",0.92],["a plastic toy",0.95],["cooking oil",0.9],["a rock",2.7],["an iron nail",7.9],["a gold ring",19.3],["a glass marble",2.5],["a steel bolt",7.8],["an aluminum can",2.7],["a wax candle",0.93]];
function poolProps(R){var mc=[],sa=[];
  mc.push(MC(R,"What is a <b>property</b> of matter?","Any characteristic of matter",["Only the weight of an object","A change that makes a new substance","The place where matter is found","A type of energy"],"A property is any characteristic of matter."));
  mc.push(MC(R,"Properties of matter help us to ______.","identify the matter and decide what it is useful for",["make new matter","destroy matter","remove mass","stop chemical changes"],"Properties tell us how to identify matter and what a substance may be useful for."));
  mc.push(MC(R,"<b>Physical</b> properties can be observed ______.","with our senses",["only when the substance changes into something new","only with a microscope","only after burning it","only by heating it"],"Physical properties can be observed with our senses (color, shape, texture, smell)."));
  mc.push(MC(R,"<b>Chemical</b> properties can be observed ONLY when ______.","the identity of the substance changes",["the color changes","the shape changes","the object is cut in half","the object is frozen"],"A chemical property shows up only when a substance becomes a different substance."));
  [["its color","physical"],["its shape","physical"],["its texture","physical"],["its smell","physical"],["its size","physical"],["its ability to burn (flammability)","chemical"],["its ability to rust","chemical"],["its ability to react with vinegar","chemical"],["its ability to tarnish","chemical"],["its ability to rot","chemical"]].forEach(function(p){
    mc.push(MC(R,"Is <b>"+p[0]+"</b> a physical property or a chemical property?",p[1]+" property",[p[1]==="physical"?"chemical property":"physical property"],p[1]==="physical"?"You can observe it with your senses without changing the substance.":"You can only see it when the substance changes into something new.",{key:p[0]}))});
  [["electric conductivity","Electric wires are made of copper because copper has good ______."],["heat conductivity","Cooking pots are made of metal because metal has good ______."],["malleability","A blacksmith can hammer a hot metal into a thin sheet. This property is called ______."],["strength","Steel beams are used to build bridges because metal has great ______."]].forEach(function(m){
    mc.push(MC(R,m[1],m[0],["electric conductivity","heat conductivity","malleability","strength","density","flammability"].filter(function(x){return x!==m[0]}),"Metals are important because of their electric conductivity, heat conductivity, malleability and strength.",{key:m[0]}))});
  mc.push(MC(R,"Which is <b>not</b> one of the important properties of metals listed in the review guide?","Easily dissolves in water",["Electric conductivity","Heat conductivity","Malleability","Strength"],"Metals are important for their electric conductivity, heat conductivity, malleability and strength."));

    mc.push(MC(R,"Water has a density of 1.0 g/cm³. "+d[0].replace(/^./,function(c){return c.toUpperCase()})+" has a density of "+d[1]+" g/cm³. Will it float or sink in water?",fl?"It will float":"It will sink",[fl?"It will sink":"It will float"],fl?"Its density is less than water's, so it floats.":"Its density is greater than water's, so it sinks.",{key:"d"+d[0]}))});
  mc.push(MC(R,"<b>Density</b> is ______.","how much matter there is in a given volume",["how hot something is","how fast something moves","how much space is between two objects","how strong a material is"],"Density = how much matter there is in a given volume."));
  mc.push(MC(R,"Density helps to determine whether something ______.","floats or sinks",["burns or rusts","melts or freezes","conducts electricity","is a mixture or compound"],"Density determines buoyancy: whether something floats or sinks."));
  sa.push(SA("In your own words, what is a property of matter?",[["characteristic","feature","trait","quality","describ"]],"A property is any characteristic of matter."));
  sa.push(SA("Why are the properties of matter useful to scientists? Give two reasons.",[["identify","tell what","figure out what","what it is","recogni"],["useful","use","good for","used for"]],"Properties tell us how to identify matter and what a substance may be useful for."));
  sa.push(SA("How is a chemical property different from a physical property?",[["identity","change","react","new substance","become"],["sens","observe","see","touch","smell","without"]],"Chemical properties can be observed ONLY when the identity of the substance changes. Physical properties can be observed with our senses."));
  sa.push(SA("Name two properties of metals that make metals important.",[["electric"],["heat","thermal"],["malleab","hammer","bend","shape"],["strength","strong"]],"Metals are important because of their electric conductivity, heat conductivity, malleability and strength.",2));
  sa.push(SA("What does density tell you about an object, and how does it help you tell if the object will float or sink?",[["how much","amount","mass","matter","packed"],["float","sink","buoyan"]],"Density is how much matter there is in a given volume. It determines whether something floats or sinks (buoyancy)."));
  sa.push(SA("Why are electrical wires made of metal?",[["electric","conduct","current","flow"]],"Metals have good electric conductivity, so electricity flows easily through them."));
  return{mc:mc,sa:sa}}

/* ======= TOPIC 3: states of matter ======= */
var STATEDEF={solid:"definite shape and definite volume",liquid:"indefinite shape (takes the shape of its container) and definite volume",gas:"indefinite shape and indefinite volume (takes the shape and volume of its container)"};
function poolStates(R){var mc=[],sa=[],S3=["solid","liquid","gas"];
  S3.forEach(function(s){mc.push(MC(R,"Which statement describes a <b>"+s+"</b>?",STATEDEF[s].replace(/^./,function(c){return c.toUpperCase()}),S3.filter(function(x){return x!==s}).map(function(x){return STATEDEF[x].replace(/^./,function(c){return c.toUpperCase()})}),"A "+s+" has "+STATEDEF[s]+".",{key:"def"+s}))});
  [["Which state of matter has a definite shape and a definite volume?","solid"],["Which state of matter takes the shape of its container but has a definite volume?","liquid"],["Which state of matter takes both the shape and the volume of its container?","gas"],["A rock keeps its shape no matter what container it is in. It is a ______.","solid"],["Juice poured from a tall glass into a short, wide bowl changes shape but not volume. Juice is a ______.","liquid"],["Helium inside a balloon spreads out to fill the whole balloon. Helium is a ______.","gas"]].forEach(function(p,i){
    mc.push(MC(R,p[0],p[1],S3.filter(function(x){return x!==p[1]}).concat(["plasma"]),"A "+p[1]+" has "+STATEDEF[p[1]]+".",{key:"s"+i}))});
  S3.forEach(function(s){mc.push(MC(R,"Which picture shows the particles of a <b>"+s+"</b>?",particles(R,s),[particles(R,S3.filter(function(x){return x!==s})[0]),particles(R,S3.filter(function(x){return x!==s})[1])],{solid:"In a solid, the particles are packed tightly in a fixed pattern.",liquid:"In a liquid, the particles touch but can slide past each other.",gas:"In a gas, the particles are far apart and spread out."}[s],{key:"pic"+s,pic:true}))});
  mc.push(MC(R,"Particles are packed tightly in a fixed pattern in a ______.","solid",["liquid","gas","mixture"],"Solid particles are packed tightly and stay in place."));
  mc.push(MC(R,"Particles are spread far apart and move freely in a ______.","gas",["solid","liquid","compound"],"Gas particles are far apart."));
  mc.push(MC(R,"As matter changes from a solid to a liquid to a gas, which three things happen?","The temperature gets higher, the density gets lower and the energy gets higher",["The temperature gets lower, the density gets higher and the energy gets lower","The temperature gets higher, the density gets higher and the energy gets lower","The density gets higher and the energy gets higher","The temperature stays the same and the density gets higher"],"Moving from solid to gas means higher temperature, lower density and higher energy."));
  mc.push(MC(R,"Which state of matter has the <b>highest</b> energy?","Gas",["Solid","Liquid","They all have the same energy"],"Gas particles have the most energy. Solid particles have the least."));
  mc.push(MC(R,"Which state of matter has the <b>lowest</b> density?","Gas",["Solid","Liquid","Ice"],"The particles of a gas are far apart, so a gas has the lowest density."));
  sa.push(SA("Describe the shape and volume of a <b>solid</b>.",[["definite","fixed","keeps","stay","same"],["shape"],["volume"]],"A solid has a definite shape and a definite volume."));

  for(var k=0;k<NCAND;k++){var Q=t.gen(RNG(seed*31+k)),sc=0;Q.forEach(function(q){if(avoid[q.plain])sc++});
    if(sc<bs){bs=sc;best=k;bq=Q;if(sc===0)break}}
  var ks=Object.keys(pk);if(ks.length>80){ks.slice(0,ks.length-60).forEach(function(x){delete pk[x]})}
  pk[key]=best;lsSet("sc_pick",pk);return bq}
function rememberSet(t,Q){var h=lsGet("sc_hist",{}),a=h[t.id]||[];
  Q.forEach(function(q){if(a.indexOf(q.plain)<0)a.push(q.plain)});
  if(a.length>120)a=a.slice(a.length-120);h[t.id]=a;lsSet("sc_hist",h)}
function seedFor(id){var m=lsGet("sc_seeds",{});if(!m[id]){m[id]=Math.floor(Math.random()*1e9)+1;lsSet("sc_seeds",m)}return m[id]}
function newSeed(id){var m=lsGet("sc_seeds",{});m[id]=Math.floor(Math.random()*1e9)+1;lsSet("sc_seeds",m);return m[id]}
function newU(){return{choice:null,text:"",checked:false,ok:false,overridden:false}}
function lastFor(t){var l=MPE.log().filter(function(r){return r.test==="Science: Unit 1 Review"&&r.section===t.name});var r=l[l.length-1];
  return r?"Last on this device: "+r.score+" of "+r.total+" ("+Math.round(r.score/r.total*100)+"%)"+(r.child?" by "+r.child:""):""}

/* ---------- screens ---------- */
function home(){S.view="home";S.topic=null;
  app.innerHTML='<div class="row"><a class="btn ghost" href="../" style="text-decoration:none">&larr; Spelling</a><a class="btn ghost" href="../../scores/" style="text-decoration:none">My Scores</a></div>'+
   '<div><div class="tag">Levin &middot; 5th grade</div><h1>Science: Unit 1 Review</h1></div>'+
   '<p class="small" style="margin:-6px 0 0">Practice for the Unit 1 Concept Review Guide (pages 1 to 3). Each set has multiple choice and short answer questions. Tap <b>New questions</b> any time for a fresh set.</p>'+
   '<div class="topics">'+TOPICS.map(function(t){var n=genSet(t,seedFor(t.id)).length;
    return '<section class="card topic"><h2>'+esc(t.name)+'</h2><p>'+esc(t.desc)+'</p><p>'+n+' questions</p><p class="last">'+esc(lastFor(t))+'</p><div class="row"><button class="btn" data-go="'+t.id+'">Start</button><button class="btn ghost" data-new="'+t.id+'">New questions</button></div></section>'}).join("")+'</div>';
  app.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){start(b.dataset.go,seedFor(b.dataset.go))}});
  app.querySelectorAll("[data-new]").forEach(function(b){b.onclick=function(){newSeed(b.dataset.new);home()}})}

function mpeOpts(t){return{key:t.id,
  getState:function(){if(S.view==="test"&&S.topic&&S.i<S.Q.length)return{label:"question "+(S.i+1)+" of "+S.Q.length,topic:t.id,seed:S.seed,i:S.i,res:S.res,picks:S.picks};return null},
  resume:function(st){var tp=topicById(st.topic);if(!tp)return;S.topic=tp;S.seed=st.seed;
    S.Q=genSet(tp,st.seed);S.i=st.i;S.res=st.res||[];S.picks=st.picks||[];S.view="test";S.U=newU();renderQ()},
  exit:function(){home()}}}
function start(id,seed){var t=topicById(id);S.topic=t;S.seed=seed;MPE.begin(mpeOpts(t));
  S.Q=genSet(t,seed);rememberSet(t,S.Q);S.i=0;S.res=[];S.picks=[];S.view="test";S.U=newU();renderQ()}

function renderQ(){var q=S.Q[S.i],U=S.U,n=S.Q.length,html='<div class="row" style="justify-content:space-between"><button class="btn ghost" id="quit">Home</button><span class="tag">Question '+(S.i+1)+' of '+n+'</span></div><div class="bar"><i style="width:'+Math.round(S.i/n*100)+'%"></i></div><div><div class="tag">'+esc(S.topic.name)+' &middot; '+esc(q.part||"")+'</div></div>';
  html+='<section class="card" id="qcard"><div class="stem">'+q.q+'</div>';
  if(q.t==="mc"){
    html+='<div class="opts">'+q.opts.map(function(o,j){var c="opt";if(U.checked){if(j===q.a)c+=" right";else if(j===U.choice)c+=" wrong"}else if(j===U.choice)c+=" sel";
      return '<button class="'+c+'" data-o="'+j+'"'+(U.checked?" disabled":"")+'><b>'+"ABCD"[j]+'</b><span>'+o+'</span></button>'}).join("")+'</div>'}
  else{html+='<p class="small">Write your answer in a sentence. Use the science words you learned.</p><textarea id="ans" rows="3" placeholder="Type your answer here..."'+(U.checked?" disabled":"")+'></textarea>'}
  if(U.checked){html+='<div class="fb '+(U.ok?"good":"bad")+'">'+(U.ok?(U.overridden?"Counted as correct.":"Correct!"):"Not quite.")+'<span>'+(q.t==="sa"?'<b>Model answer:</b> '+esc(q.model):q.exp)+'</span>'+(!U.ok&&q.t==="sa"?'<button class="btn ghost" id="right" style="margin-top:8px">My answer was right too</button>':'')+'</div>'}
  html+='<div class="row" style="margin-top:14px">'+(U.checked?'<button class="btn" id="next">'+(S.i+1>=n?"See my score":"Next")+'</button>':'<button class="btn" id="check"'+((q.t==="mc"?U.choice!==null:U.text.trim().length>0)?"":" disabled")+'>Check</button>')+'</div></section>';
  app.innerHTML=html;
  document.getElementById("quit").onclick=function(){if(confirm("Go back home? Use the yellow Save button first if you want to continue later."))home()};
  app.querySelectorAll("[data-o]").forEach(function(b){b.onclick=function(){U.choice=+b.dataset.o;renderQ()}});
  var ta=document.getElementById("ans");if(ta){ta.value=U.text;ta.oninput=function(){U.text=ta.value;var c=document.getElementById("check");if(c)c.disabled=!U.text.trim()};if(!U.checked)ta.focus()}
  var ck=document.getElementById("check");if(ck)ck.onclick=function(){U.checked=true;U.ok=q.t==="mc"?U.choice===q.a:gradeSA(q,U.text);renderQ();window.scrollTo(0,document.body.scrollHeight)};
  var rt=document.getElementById("right");if(rt)rt.onclick=function(){U.ok=true;U.overridden=true;renderQ()};
  var nx=document.getElementById("next");if(nx)nx.onclick=function(){S.res[S.i]=U.ok?1:0;S.picks[S.i]={sel:q.t==="mc"?U.choice:null,given:q.t==="sa"?U.text:"",ok:U.ok};S.i++;MPE.autosave();
    if(S.i>=S.Q.length)return results();S.U=newU();renderQ();window.scrollTo(0,0)}}

function results(){S.view="results";var n=S.Q.length,sc=S.res.reduce(function(a,b){return a+b},0),pct=Math.round(sc/n*100);
  MPE.finish({test:"Science: Unit 1 Review",section:S.topic.name,score:sc,total:n});
  var rows=S.Q.map(function(q,i){var pk=S.picks[i]||{};return MPE.reviewItem(q,{ok:S.res[i]===1,sel:pk.sel,given:pk.given||"(no answer)"},i,{LT:["A","B","C","D"],correct:function(x){return x.model},alwaysCorrect:true,sec:q.part})}).join("");
  var msg=pct===100?"Perfect score!":pct>=90?"Excellent work!":pct>=70?"Good job. A little more practice.":"Keep practicing. Review the answers below, then try again.";
  app.innerHTML='<section class="card"><div class="tag">'+esc(S.topic.name)+'</div><div class="score">'+sc+' / '+n+' &middot; '+pct+'%</div><h2>'+msg+'</h2>'+
   '<div class="row"><button class="btn" id="new">New questions</button><button class="btn ghost" id="again">Try these again</button><button class="btn ghost" id="hm">Home</button></div></section>'+
   '<h3>Review of your answers</h3><p class="small">Green is the correct answer. Red is what you picked. Short answers show the model answer.</p><div class="review">'+rows+'</div>';
  document.getElementById("new").onclick=function(){start(S.topic.id,newSeed(S.topic.id))};
  document.getElementById("again").onclick=function(){start(S.topic.id,S.seed)};
  document.getElementById("hm").onclick=home}

window.__sci={TOPICS:TOPICS,RNG:RNG,genSet:genSet,gradeSA:gradeSA,state:function(){return S},topicById:topicById};
home();
})();
</script>
